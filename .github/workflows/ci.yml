name: CI ISUR

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Mostrar archivos
        run: ls
        
      - name: Construir imagen Docker
        run: docker build -t mi-app .

      - name: Ejecutar contenedor
        run: docker run -d -p 8080:80 mi-app
        
      - name: Mensaje
        run: echo "Pipeline ejecutado correctamente"
